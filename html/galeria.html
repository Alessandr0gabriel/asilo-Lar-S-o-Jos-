  <body>
    <div class="site-nav-wrap">
      <div class="site-shell">
        <nav class="site-nav" aria-label="Navegação principal">
          <a href="index.html" class="brand"

    <main class="site-shell page">
      <header class="panel page-head reveal" style="--delay: 40ms">
        <h1>Galeria</h1>
        <p>
          Fotos e vídeo da nossa estrutura. Reforma realizada em 06/jul/2021.
        </p>
      </header>

      <section class="panel reveal" style="--delay: 110ms">
        <div class="galleryy">
          <figure>
            <img src="../galeria/foto_do_asilo1.jpg" alt="Infraestrutura do asilo 1" />
            <figcaption>Ambiente de convivência e cuidado.</figcaption>
          </figure>
          <figure>
            <img src="../galeria/foto_do_asilo2.jpg" alt="Infraestrutura do asilo 2" />
            <figcaption>Espaços preparados para acolhimento.</figcaption>
          </figure>
          <figure>
            <img src="../galeria/foto_do_asilo3.jpg" alt="Infraestrutura do asilo 3" />
            <figcaption>Melhorias estruturais do Lar São José.</figcaption>
          </figure>
          <figure>
            <video class="video" controls>
              <source src="../galeria/Vídeo do asilo.mp4" type="video/mp4" />
              Seu navegador não suporta a tag de vídeo.
            </video>
            <figcaption>Vídeo institucional da estrutura.</figcaption>
          </figure>
        </div>
      </section>

      <footer>
        <p>
          © <span class="currentYear"></span> ACPIC Lar São José Colorado/PR.
          Todos os direitos reservados.
